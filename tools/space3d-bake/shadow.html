<!doctype html><html><head><meta charset="utf-8"></head><body><script type="module">
import * as T from 'three'
const renderer = new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true})
renderer.setSize(256,256);renderer.shadowMap.enabled=true
const scene = new T.Scene(),camera=new T.OrthographicCamera(-1,1,1,-1,.1,10)
camera.position.set(0,3,0);camera.up.set(0,0,-1);camera.lookAt(0,0,0)
const material=new T.MeshStandardMaterial({color:'#FFFFFF',roughness:1})
const plane=new T.Mesh(new T.PlaneGeometry(2,2),material);plane.rotation.x=-Math.PI/2;plane.receiveShadow=true;scene.add(plane)
const cube=new T.Mesh(new T.BoxGeometry(.35,.35,.35),material);cube.position.set(0,.35,0);cube.castShadow=true;scene.add(cube)
scene.add(new T.AmbientLight('#FFFFFF',.15))
const sun=new T.DirectionalLight('#FFFFFF',3);sun.position.set(-1,3,1);sun.castShadow=true
sun.shadow.mapSize.set(512,512);Object.assign(sun.shadow.camera,{left:-1,right:1,top:1,bottom:-1,near:.1,far:6});sun.shadow.camera.updateProjectionMatrix();scene.add(sun)
window.shadowProbe=()=>{
 const results={}
 for(const [name,type] of [['soft',T.PCFSoftShadowMap],['pcf',T.PCFShadowMap]]){
  renderer.shadowMap.type=type;material.needsUpdate=true
  const arrays=[]
  for(const radius of [1,6]){
   sun.shadow.radius=radius;renderer.render(scene,camera)
   const pixels=new Uint8Array(256*256*4);renderer.getContext().readPixels(0,0,256,256,renderer.getContext().RGBA,renderer.getContext().UNSIGNED_BYTE,pixels);arrays.push(pixels)
  }
  let differingBytes=0;for(let i=0;i<arrays[0].length;i++)if(arrays[0][i]!==arrays[1][i])differingBytes++
  results[name]={radius:[1,6],differingBytes}
 }
 return {three:T.REVISION,results,source:'Chromium SwiftShader',size:256,shadowSize:512}
}
window.shadowReady=true
</script></body></html>
