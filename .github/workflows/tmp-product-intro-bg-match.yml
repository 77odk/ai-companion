name: temp product intro bg match
on:
  push:
    branches:
      - feat/welcome-product-intro-3d
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify matching scene backgrounds
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/eluvin-preview.log 2>&1 &
          cat > bg-match.mjs <<'EOF'
          import { chromium } from 'playwright'
          import assert from 'node:assert/strict'
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:390,height:844}})
          await page.route('**/api/site-stats', async r => r.fulfill({status:200,contentType:'application/json',body:'{"uv":1,"pv":1}'}))
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'})
          await page.getByRole('button',{name:/先了解一下/}).click()
          await page.locator('.product-intro-v1').waitFor({state:'visible'})
          const sels=['.intro-scene-hero','.intro-scene-engine','.intro-scene-final']
          const bgs=[]
          for(const sel of sels){
            bgs.push(await page.locator(sel).evaluate(el=>getComputedStyle(el).backgroundImage))
          }
          assert.equal(bgs[1],bgs[0],'engine background equals hero')
          assert.equal(bgs[2],bgs[0],'final background equals hero')
          for(const [sel,file] of [
            ['.intro-scene-hero','01-hero.png'],
            ['.intro-scene-engine','04-engine-same-bg.png'],
            ['.intro-scene-final','06-final-same-bg.png'],
          ]){
            await page.locator(sel).scrollIntoViewIfNeeded()
            await page.waitForTimeout(80)
            await page.screenshot({path:file,fullPage:false})
          }
          await browser.close()
          EOF
          node bg-match.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: product-intro-bg-match-390x844
          path: |
            01-hero.png
            04-engine-same-bg.png
            06-final-same-bg.png
