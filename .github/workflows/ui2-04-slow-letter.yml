name: UI2-04 Slow Letter Card 1B

on:
  push:
    branches:
      - ui2-04/slow-letter-3-7d

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[slow-letter-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui2-04/slow-letter-3-7d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Card 1B patch
        run: node scripts/apply_slow_letter_card.mjs
      - name: Weekly letter tests
        run: node scripts/test_weekly_review.mjs
      - name: Production build
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm scripts/apply_slow_letter_card.mjs .github/workflows/ui2-04-slow-letter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add 3-7 day slow letter delivery [slow-letter-patched]"
          git push origin HEAD:ui2-04/slow-letter-3-7d
