name: photo image error race verify
on:
  push:
    branches:
      - fix/photo-wall-image-error-race
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test_photowall.mjs
      - run: npm run build
      - run: npm run lint
