name: UI2-04 Photo Wall Card 2

on:
  push:
    branches:
      - ui2-04/photo-felt-wall

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[photo-wall-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui2-04/photo-felt-wall
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Card 2 patch
        run: node scripts/apply_photo_felt_wall.mjs
      - name: Production build
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm scripts/apply_photo_felt_wall.mjs .github/workflows/ui2-04-photo-wall.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: rebuild Space photo wall as felt board [photo-wall-patched]"
          git push origin HEAD:ui2-04/photo-felt-wall
