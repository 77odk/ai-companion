name: temp product intro v1 static
on:
  push:
    branches:
      - feat/welcome-product-intro-3d
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/test_auth.mjs
      - run: npm run build
      - run: npm run lint
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture six static scenes
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/eluvin-preview.log 2>&1 &
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright'
          import assert from 'node:assert/strict'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 })
          const pageErrors = []
          const consoleErrors = []
          page.on('pageerror', e => pageErrors.push(String(e)))
          page.on('console', msg => {
            if (msg.type() !== 'error') return
            const t = msg.text()
            if (/beacon|cloudflare/i.test(t)) return
            consoleErrors.push(t)
          })
          await page.route('**/api/site-stats', async route => {
            await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ uv: 1, pv: 1 }) })
          })

          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })
          await page.getByRole('button', { name: /先了解一下/ }).click()
          await page.locator('.product-intro-v1').waitFor({ state: 'visible' })

          assert.equal(await page.locator('.intro-scene').count(), 6)
          assert.equal(await page.locator('.product-intro-v1').count(), 1)
          assert.equal(await page.locator('.guide-scroll').count(), 0)

          const names = [
            ['.intro-scene-hero', '01-hero.png'],
            ['.intro-scene-memory', '02-memory.png'],
            ['.intro-scene-time', '03-time.png'],
            ['.intro-scene-engine', '04-engine.png'],
            ['.intro-scene-threshold', '05-threshold.png'],
            ['.intro-scene-final', '06-final.png'],
          ]
          for (const [selector, filename] of names) {
            const scene = page.locator(selector)
            await scene.scrollIntoViewIfNeeded()
            await page.waitForTimeout(100)
            await page.screenshot({ path: filename, fullPage: false })
            const box = await scene.boundingBox()
            assert.ok(box && box.width <= 390.5, selector + ' width fits viewport')
          }

          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth)
          assert.ok(overflow <= 0, 'no horizontal overflow')

          await page.locator('.intro-start').click()
          await page.getByText('直接认识 TA', { exact: true }).waitFor({ state: 'visible' })

          assert.equal(pageErrors.length, 0, '0 pageerror')
          assert.equal(consoleErrors.length, 0, '0 unexpected console errors')
          console.log(JSON.stringify({ overflow, pageErrors, consoleErrors }))
          await browser.close()
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: product-intro-v1-static-390x844
          path: |
            01-hero.png
            02-memory.png
            03-time.png
            04-engine.png
            05-threshold.png
            06-final.png
          if-no-files-found: error
