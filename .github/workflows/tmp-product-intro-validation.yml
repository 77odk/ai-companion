name: temp product intro validation
on:
  push:
    branches:
      - feat/welcome-product-intro-3d
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Validate product intro at 390x844
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/eluvin-preview.log 2>&1 &
          cat > product-intro-validation.mjs <<'EOF'
          import { chromium } from 'playwright'
          import assert from 'node:assert/strict'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 })
          const pageErrors = []
          const consoleErrors = []
          page.on('pageerror', (err) => pageErrors.push(String(err)))
          page.on('console', (msg) => {
            if (msg.type() !== 'error') return
            const t = msg.text()
            if (/beacon|cloudflare/i.test(t)) return
            consoleErrors.push(t)
          })
          await page.route('**/api/site-stats', async (route) => {
            await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ uv: 1, pv: 1 }) })
          })

          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })
          await page.getByRole('button', { name: /先了解一下/ }).click()
          await page.getByRole('heading', { name: /让一个 TA/ }).waitFor({ state: 'visible' })

          assert.equal(await page.getByText('了解忆文', { exact: true }).count(), 1)
          assert.equal(await page.locator('.product-intro-book').count(), 1)
          assert.equal(await page.locator('.product-intro-leaf').count(), 2)
          assert.equal(await page.locator('.product-intro-orbit').count(), 3)

          const before = await page.locator('.product-intro-scroll').evaluate((el) =>
            getComputedStyle(el).getPropertyValue('--intro-leaf-b').trim()
          )
          assert.ok(before.endsWith('deg'), '3D page-turn CSS variable initialized')

          let overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth)
          assert.ok(overflow <= 0, 'hero has no horizontal overflow')
          await page.screenshot({ path: 'product-intro-hero-390x844.png', fullPage: false })

          const scroll = page.locator('.product-intro-scroll')
          await scroll.evaluate((el) => { el.scrollTop = Math.round(el.scrollHeight * 0.31); el.dispatchEvent(new Event('scroll')) })
          await page.waitForTimeout(120)
          const after = await page.locator('.product-intro-scroll').evaluate((el) =>
            getComputedStyle(el).getPropertyValue('--intro-leaf-b').trim()
          )
          assert.notEqual(after, before, 'scroll changes 3D page-turn angle')
          await page.getByText('模型负责思考，忆文负责让关系持续。').scrollIntoViewIfNeeded()
          await page.screenshot({ path: 'product-intro-system-390x844.png', fullPage: false })

          await page.getByText('忆文不是点开就能用的产品。').scrollIntoViewIfNeeded()
          await page.screenshot({ path: 'product-intro-threshold-390x844.png', fullPage: false })
          assert.equal(await page.getByText(/API Key/).count() > 0, true)

          const start = page.getByRole('button', { name: /开始遇见 TA/ })
          await start.scrollIntoViewIfNeeded()
          await page.screenshot({ path: 'product-intro-final-390x844.png', fullPage: false })
          await start.click()
          await page.getByText('直接认识 TA', { exact: true }).waitFor({ state: 'visible' })

          overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth)
          assert.ok(overflow <= 0, 'role handoff has no horizontal overflow')

          // 独立浏览器页确认：登录墙的「先看看教程」仍然进入旧 Guide。
          const tutorial = await browser.newPage({ viewport: { width: 390, height: 844 } })
          const tutorialErrors = []
          tutorial.on('pageerror', (err) => tutorialErrors.push(String(err)))
          await tutorial.addInitScript(() => {
            localStorage.setItem('eluvin_consent', JSON.stringify({ version: 'v1', consentedAt: '2026-09-24T00:00:00.000Z' }))
          })
          await tutorial.route('**/api/site-stats', async (route) => {
            await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ uv: 1, pv: 1 }) })
          })
          await tutorial.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })
          await tutorial.getByRole('button', { name: /开始遇见 TA/ }).click()
          await tutorial.getByRole('button', { name: '已有账号直接登录' }).click()
          await tutorial.getByRole('button', { name: '先看看教程' }).click()
          await tutorial.getByText('使用指南', { exact: true }).waitFor({ state: 'visible' })
          assert.equal(await tutorial.locator('.product-intro-page').count(), 0, 'login tutorial remains the old Guide')
          assert.equal(tutorialErrors.length, 0, 'tutorial route has 0 pageerror')
          await tutorial.close()

          assert.equal(pageErrors.length, 0, '0 pageerror')
          assert.equal(consoleErrors.length, 0, '0 unexpected console error')
          console.log(JSON.stringify({ before, after, overflow, pageErrors, consoleErrors }))
          await browser.close()
          EOF
          node product-intro-validation.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: product-intro-390x844
          path: |
            product-intro-hero-390x844.png
            product-intro-system-390x844.png
            product-intro-threshold-390x844.png
            product-intro-final-390x844.png
          if-no-files-found: error
