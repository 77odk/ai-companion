name: Temporary PR136 Verify

on:
  push:
    branches:
      - feat/space-conversation-trace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Space-N1 targeted test
        run: node scripts/test_space_conversation_trace.mjs

      - name: Full test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
