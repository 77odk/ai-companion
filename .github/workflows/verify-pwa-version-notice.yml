name: verify-pwa-version-notice

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare legacy absolute test path
        run: |
          sudo mkdir -p /home/ubuntu/projects/ai-companion-mvp
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/ubuntu/projects/ai-companion-mvp/frontend
      - run: TZ=Asia/Shanghai node scripts/test_pwa_version_notice.mjs
      - run: TZ=Asia/Shanghai npm test
      - run: npm run build
      - name: Verify version asset
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const p = 'dist/version.json'
          if (!fs.existsSync(p)) throw new Error('dist/version.json missing')
          const body = JSON.parse(fs.readFileSync(p, 'utf8'))
          if (!body.version || typeof body.version !== 'string') throw new Error('version missing')
          console.log('version asset:', body.version)
          NODE
      - run: npm run lint --if-present
      - run: git diff --check origin/main...HEAD
