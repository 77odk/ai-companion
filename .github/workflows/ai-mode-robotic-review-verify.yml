name: ai mode robotic review verify
on:
  push:
    branches:
      - fix/ai-mode-robotic-review

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Identity mode tests
        run: node scripts/test_identity_modes.mjs
      - name: Chat regressions
        run: node scripts/test_reply_hygiene.mjs && node scripts/test_prompt_attribution.mjs && node scripts/test_memory_correction.mjs && node scripts/test_context_composer.mjs
      - run: npm run build
      - run: npm run lint
