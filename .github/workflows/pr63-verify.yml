name: PR63 verification

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Compatibility symlink for legacy tests
        run: |
          sudo mkdir -p /home/ubuntu/projects/ai-companion-mvp
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/ubuntu/projects/ai-companion-mvp/frontend
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint --if-present
      - run: git diff --check origin/main...HEAD
