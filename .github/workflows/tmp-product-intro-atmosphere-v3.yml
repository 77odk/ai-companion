name: temp product intro atmosphere v3
on:
  push:
    branches:
      - feat/welcome-product-intro-3d
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify atmosphere layer at 390x844
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/eluvin-preview.log 2>&1 &
          cat > atmosphere-v3.mjs <<'EOF'
          import { chromium } from 'playwright'
          import assert from 'node:assert/strict'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 3 })
          const errors = []
          page.on('pageerror', err => errors.push(String(err)))
          page.on('console', msg => {
            if (msg.type() === 'error' && !/favicon|beacon|cloudflare/i.test(msg.text())) errors.push(msg.text())
          })
          await page.route('**/api/site-stats', async route => {
            await route.fulfill({status:200,contentType:'application/json',body:'{"uv":1,"pv":1}'})
          })
          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })
          await page.getByRole('button', { name: /先了解一下/ }).click()
          await page.locator('.product-intro-v1').waitFor({ state: 'visible' })

          const canvas = page.locator('.intro-atmosphere')
          await canvas.waitFor({ state: 'visible' })
          const canvasState = await canvas.evaluate(el => {
            const c = el
            const rect = c.getBoundingClientRect()
            const style = getComputedStyle(c)
            return {
              cssWidth: rect.width,
              cssHeight: rect.height,
              pixelWidth: c.width,
              pixelHeight: c.height,
              z: Number(style.zIndex),
              pointerEvents: style.pointerEvents,
              opacity: style.opacity,
            }
          })

          assert.equal(canvasState.cssWidth, 390)
          assert.equal(canvasState.cssHeight, 844)
          assert.ok(canvasState.pixelWidth <= 390 * 1.5 + 2, 'DPR is capped at 1.5')
          assert.ok(canvasState.pixelHeight <= 844 * 1.5 + 2, 'DPR is capped at 1.5')
          assert.equal(canvasState.pointerEvents, 'none')

          const copyZ = await page.locator('.intro-hero-copy h1').evaluate(el => Number(getComputedStyle(el).zIndex))
          assert.ok(copyZ > canvasState.z, 'copy renders above atmosphere canvas')

          await page.screenshot({ path: '01-atmosphere-hero.png', fullPage: false })
          const main = page.locator('.product-intro-v1 main')
          const memory = page.locator('.intro-scene-memory')
          await memory.scrollIntoViewIfNeeded()
          await page.waitForTimeout(180)
          await page.screenshot({ path: '02-atmosphere-memory.png', fullPage: false })
          const engine = page.locator('.intro-scene-engine')
          await engine.scrollIntoViewIfNeeded()
          await page.waitForTimeout(180)
          await page.screenshot({ path: '04-atmosphere-engine.png', fullPage: false })

          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth)
          assert.ok(overflow <= 0, 'no horizontal overflow')

          // Reduced motion keeps a static canvas but does not animate the narrative.
          const reduced = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 })
          await reduced.emulateMedia({ reducedMotion: 'reduce' })
          await reduced.route('**/api/site-stats', async route => {
            await route.fulfill({status:200,contentType:'application/json',body:'{"uv":1,"pv":1}'})
          })
          await reduced.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })
          await reduced.getByRole('button', { name: /先了解一下/ }).click()
          await reduced.locator('.product-intro-v1').waitFor({ state: 'visible' })
          assert.equal(await reduced.locator('.product-intro-v1').getAttribute('data-motion'), 'reduced')
          await reduced.locator('.intro-atmosphere').waitFor({ state: 'visible' })
          await reduced.screenshot({ path: 'reduced-atmosphere.png', fullPage: false })

          assert.equal(errors.length, 0, errors.join('\n'))
          console.log(JSON.stringify({ canvasState, overflow }))
          await browser.close()
          EOF
          node atmosphere-v3.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: product-intro-atmosphere-v3-390x844
          path: |
            01-atmosphere-hero.png
            02-atmosphere-memory.png
            04-atmosphere-engine.png
            reduced-atmosphere.png
          if-no-files-found: error
