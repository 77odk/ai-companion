name: verify-memory-upload-retry-safe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test_memory_upload_retry_safe.mjs
      - run: TZ=Asia/Shanghai npm test
      - run: npm run build
      - run: npm run lint --if-present
      - run: git diff --check origin/main...HEAD
