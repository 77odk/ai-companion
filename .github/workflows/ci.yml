name: CI

on:
  pull_request:
    branches:
      - main
      - sandbox
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # G0-A only: generate true-source E/C screenshots on the Draft PR.
      # This is a preview artifact, NOT production deployment or art signoff.
      - name: Space G0-A true-art preview
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/space-mobile-visual-baseline'
        run: python3 scripts/g0a_full_layer_preview.py --engine chrome-cli --out _space_art_review

      - name: Upload G0-A review frames
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/space-mobile-visual-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: space-g0a-native-art-qa
          path: _space_art_review/
          if-no-files-found: warn
          retention-days: 7
