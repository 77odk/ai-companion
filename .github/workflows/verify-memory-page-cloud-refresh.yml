name: verify-memory-page-cloud-refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare legacy absolute test path
        run: |
          sudo mkdir -p /home/ubuntu/projects/ai-companion-mvp
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/ubuntu/projects/ai-companion-mvp/frontend
      - run: node scripts/test_memory_page_cloud_refresh.mjs
      - run: node scripts/test_memory_recall.mjs
      - run: node scripts/test_memory_recency.mjs
      - run: node scripts/test_memory_saved.mjs
      - run: node scripts/test_memory_summary.mjs
      - run: node scripts/test_memorywall.mjs
      - run: TZ=Asia/Shanghai npm test
      - run: npm run build
      - run: npm run lint --if-present
      - run: git diff --check origin/main...HEAD
