name: P1D verify
on:
  push:
    branches:
      - fix/p1d-code-convergence-performance
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - name: Asset sizes
        run: |
          find dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort -k2 -nr
          echo '--- gzip ---'
          for f in dist/assets/*; do printf '%s ' "$(basename "$f")"; gzip -c "$f" | wc -c; done | sort -k2 -nr
