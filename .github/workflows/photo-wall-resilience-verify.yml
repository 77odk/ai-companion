name: photo wall resilience verify
on:
  push:
    branches:
      - fix/photo-wall-resilience

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Photo wall tests
        run: node scripts/test_photowall.mjs
      - name: Space regressions
        run: node scripts/test_aispace.mjs && node scripts/test_aispace_v3.mjs && node scripts/test_space_time_fix.mjs
      - name: Identity regression
        run: node scripts/test_identity_modes.mjs
      - name: Thinking request regression
        run: node scripts/test_thinking_request.mjs
      - run: npm run build
      - run: npm run lint
