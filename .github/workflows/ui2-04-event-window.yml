name: UI2-04 Event Candidate Window Card 3

on:
  push:
    branches:
      - ui2-04/event-candidate-window

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[event-window-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui2-04/event-candidate-window
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Card 3 patch
        run: node scripts/apply_event_candidate_window.mjs
      - name: Event detector tests
        run: node scripts/test_event_detector.mjs
      - name: Production build
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm scripts/apply_event_candidate_window.mjs .github/workflows/ui2-04-event-window.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add bounded Event candidate window [event-window-patched]"
          git push origin HEAD:ui2-04/event-candidate-window
