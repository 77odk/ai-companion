name: UI2-04 validate

on:
  push:
    branches:
      - ui2-04/space-letter-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run test files individually
        shell: bash
        run: |
          failed=0
          : > failed-tests.txt
          for f in scripts/test_*.mjs; do
            echo "::group::$f"
            if node --test "$f"; then
              echo "PASS $f"
            else
              echo "$f" >> failed-tests.txt
              echo "::error file=$f,title=Test failed::$f failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Upload failed test names
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests
          path: failed-tests.txt
          if-no-files-found: ignore
      - name: Build
        if: always()
        run: npm run build
      - name: Recheck same failures on main baseline
        if: always()
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout --detach FETCH_HEAD
          : > main-baseline-failed-tests.txt
          for f in scripts/test_memory_ux_polish.mjs scripts/test_memory_write_failure.mjs; do
            if node --test "$f"; then
              echo "PASS $f on main"
            else
              echo "$f" >> main-baseline-failed-tests.txt
              echo "FAIL $f on main"
            fi
          done
      - name: Upload main baseline failure names
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-baseline-failed-tests
          path: main-baseline-failed-tests.txt
          if-no-files-found: ignore

