name: UI2-04 validate

on:
  push:
    branches:
      - ui2-04/space-letter-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run test files individually
        shell: bash
        run: |
          failed=0
          for f in scripts/test_*.mjs; do
            echo "::group::$f"
            if node --test "$f"; then
              echo "PASS $f"
            else
              echo "::error file=$f,title=Test failed::$f failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Build
        if: always()
        run: npm run build

